name: natixis-integrador

services:
  api:
    build: .
    image: natixis-support:local
    ports:
      # Porta alternativa 8180 (DinD natixis-lab so expoe 8100-8199 ao host); destino interno 8000
      - "8180:8000"
    environment:
      SERVICE_NAME: support-api-integrador
      DATA_DIR: /data
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  checker:
    image: curlimages/curl:8.11.1
    profiles: ["diagnostico"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  app-data:
